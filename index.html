<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>記帳 · Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="store.jsx"></script>
<script type="text/babel" src="charts.jsx"></script>
<script type="text/babel" src="pages-dashboard.jsx"></script>
<script type="text/babel" src="pages-transactions.jsx"></script>
<script type="text/babel" src="pages-accounts-reports.jsx"></script>
<script type="text/babel" src="pages-invoice-data.jsx"></script>
<script type="text/babel" src="pages-invoice-analytics.jsx"></script>
<script type="text/babel" src="pages-invoice.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMode": false,
  "accentHue": 24,
  "serifTitles": true,
  "density": "comfy",
  "cardRadius": 14,
  "showAuxAmount": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const ledger = useLedger();
  const [route, setRoute] = React.useState('dashboard'); // dashboard | add | transfer | transactions | accounts | account:<id> | reports | budgets | settings
  const [addPrefill, setAddPrefill] = React.useState(null);

  // apply tweaks to root
  React.useEffect(() => {
    document.documentElement.dataset.theme = t.darkMode ? 'dark' : 'light';
    document.documentElement.style.setProperty('--accent', `oklch(0.62 0.13 ${t.accentHue})`);
    document.documentElement.style.setProperty('--accent-soft', `oklch(0.88 0.05 ${t.accentHue})`);
    document.documentElement.style.setProperty('--negative', `oklch(0.62 0.13 ${t.accentHue})`);
    document.documentElement.style.setProperty('--radius', t.cardRadius + 'px');
    if (!t.serifTitles) {
      document.documentElement.style.setProperty('--serif', '"Inter", "Noto Sans TC", system-ui, sans-serif');
    } else {
      document.documentElement.style.setProperty('--serif', '"Newsreader", "Noto Serif TC", Georgia, serif');
    }
  }, [t.darkMode, t.accentHue, t.serifTitles, t.cardRadius]);

  const nav = (target) => {
    if (typeof target === 'object' && target.name === 'add') {
      setAddPrefill(target.prefill);
      setRoute('add');
      return;
    }
    setAddPrefill(null);
    setRoute(target);
  };

  const navItems = [
    { id: 'dashboard', glyph: '◐', label: '總覽', en: 'Dashboard' },
    { id: 'transactions', glyph: '≡', label: '交易', en: 'Transactions' },
    { id: 'accounts', glyph: '▢', label: '帳戶', en: 'Accounts' },
    { id: 'reports', glyph: '◍', label: '報告', en: 'Reports' },
    { id: 'budgets', glyph: '◇', label: '預算', en: 'Budgets' },
    { id: 'invoice', glyph: '◱', label: '電子發票', en: 'Invoice' },
    { id: 'settings', glyph: '✦', label: '設定', en: 'Settings' },
  ];

  const isActive = (id) => {
    if (id === 'accounts' && route.startsWith('account:')) return true;
    if (id === 'transactions' && (route === 'add' || route === 'transfer')) return true;
    return route === id;
  };

  let page;
  if (route === 'dashboard') page = <Dashboard ledger={ledger} onNav={nav} />;
  else if (route === 'add') page = <AddTransactionPage ledger={ledger} prefill={addPrefill} onDone={() => nav('transactions')} />;
  else if (route === 'transfer') page = <TransferPage ledger={ledger} onDone={() => nav('transactions')} />;
  else if (route === 'transactions') page = <TransactionsPage ledger={ledger} onNav={nav} />;
  else if (route === 'accounts') page = <AccountsPage ledger={ledger} onNav={nav} />;
  else if (route.startsWith('account:')) page = <AccountDetailPage ledger={ledger} accountId={route.slice(8)} onNav={nav} />;
  else if (route === 'reports') page = <ReportsPage ledger={ledger} />;
  else if (route === 'budgets') page = <BudgetsPage ledger={ledger} />;
  else if (route === 'invoice') page = <InvoicePage ledger={ledger} onNav={nav} />;
  else if (route === 'settings') page = <SettingsPage ledger={ledger} />;

  // density
  const densityStyles = t.density === 'compact'
    ? { padding: '20px 28px 60px' }
    : t.density === 'cozy'
      ? { padding: '28px 36px 70px' }
      : { padding: '32px 40px 80px' };

  return (
    <div className="app" data-screen-label="App Shell">
      <aside className="sidebar">
        <div className="sidebar-brand">
          <span>記帳</span>
          <small>Ledger</small>
        </div>

        <div className="sidebar-section">主選單 · Menu</div>
        {navItems.map((n) => (
          <button key={n.id} className={'nav-item ' + (isActive(n.id) ? 'active' : '')} onClick={() => nav(n.id)}>
            <span className="nav-item-glyph">{n.glyph}</span>
            <span style={{ flex: 1 }}>{n.label}</span>
            <span style={{ fontSize: 10, opacity: 0.5, fontFamily: 'var(--mono)' }}>{n.en.slice(0, 3).toUpperCase()}</span>
          </button>
        ))}

        <div className="sidebar-section">快速 · Quick</div>
        <button className="nav-item" onClick={() => nav('add')}>
          <span className="nav-item-glyph">＋</span>
          <span>新增交易</span>
        </button>
        <button className="nav-item" onClick={() => nav('transfer')}>
          <span className="nav-item-glyph">⇄</span>
          <span>轉帳</span>
        </button>

        <div style={{ flex: 1 }} />

        <div style={{ padding: 8, fontSize: 11, color: 'var(--ink-4)', borderTop: '1px solid var(--line-soft)', paddingTop: 14, marginTop: 8 }}>
          <div className="font-mono" style={{ marginBottom: 4 }}>1 USD = {ledger.state.fxRate.toFixed(2)} TWD</div>
          <div>本機儲存 · {state(ledger).total} 筆紀錄</div>
        </div>
      </aside>

      <main className="main" style={densityStyles}>
        {page}
      </main>

      <TweaksPanel>
        <TweakSection label="主題 Theme" />
        <TweakToggle label="深色模式" value={t.darkMode} onChange={(v) => setTweak('darkMode', v)} />
        <TweakSlider label="主色調 Hue" value={t.accentHue} min={0} max={360} step={1} unit="°" onChange={(v) => setTweak('accentHue', v)} />
        <TweakToggle label="襯線標題" value={t.serifTitles} onChange={(v) => setTweak('serifTitles', v)} />
        <TweakSlider label="圓角" value={t.cardRadius} min={0} max={24} step={1} unit="px" onChange={(v) => setTweak('cardRadius', v)} />
        <TweakSection label="顯示 Display" />
        <TweakRadio label="密度" value={t.density} options={['compact', 'cozy', 'comfy']} onChange={(v) => setTweak('density', v)} />
        <TweakToggle label="顯示換算金額" value={t.showAuxAmount} onChange={(v) => setTweak('showAuxAmount', v)} />
        <TweakSection label="資料 Data" />
        <TweakButton label="重置示範資料" onClick={() => { if (confirm('重置？')) { ledger.reset(); showToast('已重置'); } }} />
      </TweaksPanel>
    </div>
  );
}

function state(ledger) {
  return { total: ledger.state.transactions.length };
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
